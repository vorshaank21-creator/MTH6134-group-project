name: Run My R Scripts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-r:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Run simple linear regression
        run: Rscript "week 2- simple linear regression.R"

      - name: Run binomial regression
        run: Rscript "binomail regression.R"

